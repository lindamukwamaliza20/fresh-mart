<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreshMart Billing Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<div class="header">
<h1> FreshMart</h1>
<img src="c:\Users\MUKWAMARIZA LINDA\Pictures\super.png" alt="">
<h2>Billing Calculator</h2>
</div>
<div class="main">

<div class="left">
<h3>Add Item</h3>
<label>Item Name</label>
<select id="itemSelect">
<option value="">Select Item</option>
<option value="Bread" data-price="800">Bread</option>
<option value="Milk" data-price="1200">Milk</option>
<option value="Rice" data-price="2000">Rice</option>
<option value="Sugar" data-price="1500">Sugar</option>
<option value="Oil" data-price="2500">Oil</option>
</select>

<label>Price (RWF)</label>
<input type="number" id="price" readonly>
<label>Quantity</label>
<input type="number" id="quantity" placeholder="Enter quantity">
<button class="add-btn" onclick="addItem()">Add Item</button>
<div class="items-list">
<h3>Available Items</h3>
<div class="item-row">
<span>Bread</span>
<span>1300</span>
</div>
<div class="item-row">
<span>Milk</span>
<span>1000</span>
</div>
<div class="item-row">
<span>Rice</span>
<span>1200</span>
</div>
<div class="item-row">
<span>Sugar</span>
<span>1500</span>
</div>
<div class="item-row">
<span>Oil</span>
<span>1500</span>
</div>
</div>
</div>
<!-- RIGHT SIDE -->
<div class="right">
<h3>Bill</h3>
<table>
<thead>
<tr>
<th>#</th>
<th>Item</th>
<th>Price</th>
<th>Qty</th>
<th>Total</th>
</tr>
</thead>
<tbody id="billBody">

</tbody>
</table>
<div class="summary">
<p>Total Amount: <span id="totalAmount">0</span> RWF</p>
<div class="payment">
<label>Amount Paid</label>
<input type="number" id="amountPaid" placeholder="Enter
amount">
</div>
<p>Change: <span id="change">0</span> RWF</p>
</div>
<div class="buttons">
<button class="calc-btn" onclick="calculateChange()">
 Calculate Change
</button>
<button class="clear-btn" onclick="clearAll()">
 Clear All
</button>
</div>
</div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
